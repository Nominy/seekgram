# Push a tag that matches Cargo.toml (e.g. v0.1.0) to build Windows x64 and
# publish a GitHub release with the zip, its checksum and the installer attached.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG doesn't match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist/package
          cp target/release/seekgram.exe LICENSE README.md dist/package/
          # ONNX Runtime needs the Visual C++ runtime. Shipping Microsoft's redistributable DLLs
          # next to seekgram.exe (app-local deployment) means no PC has to have it installed.
          crt="$(ls -d "/c/Program Files/Microsoft Visual Studio"/*/*/VC/Redist/MSVC/14.*/x64/Microsoft.VC14*.CRT | sort -V | tail -1)"
          echo "C++ runtime from $crt"
          for dll in msvcp140.dll msvcp140_1.dll vcruntime140.dll vcruntime140_1.dll; do cp "$crt/$dll" dist/package/; done
          (cd dist/package && 7z a -tzip -mx=9 ../seekgram-windows-x64.zip *)
          rm -r dist/package
          cp install.ps1 dist/
          cd dist
          test -s seekgram-windows-x64.zip
          sha256sum seekgram-windows-x64.zip install.ps1 > SHA256SUMS
          cat SHA256SUMS

      # Install what we're about to publish, the way users will: from the zip, per
      # user, then remove it again. Nothing is launched (no GPU or Telegram here).
      - name: Try the installer
        shell: powershell
        run: |
          $env:SEEKGRAM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'seekgram-data'
          .\install.ps1 -Archive dist\seekgram-windows-x64.zip -NoAutostart -NoLaunch
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Seekgram'
          if (-not (Test-Path "$dir\seekgram.exe")) { throw 'seekgram.exe was not installed' }
          if ("v$((Get-Item "$dir\seekgram.exe").VersionInfo.ProductVersion)" -ne $env:TAG.Split('-')[0]) { throw 'version resource does not match the tag' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -notlike "*$dir*") { throw 'not on PATH' }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seekgram' -ErrorAction SilentlyContinue)) { throw 'no uninstall entry' }
          .\install.ps1 -Uninstall -Purge
          if (Test-Path $dir) { throw 'uninstall left the program folder behind' }
          if ([Environment]::GetEnvironmentVariable('Path', 'User') -like "*$dir*") { throw 'still on PATH' }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "Seekgram $TAG" --generate-notes $prerelease
          fi
