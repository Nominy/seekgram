name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push supersedes a running check of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest

      # nextest builds what it tests; a separate `cargo build` compiled everything twice.
      # The `ci` profile leaves dependencies unoptimized (see Cargo.toml).
      - name: Build and test
        run: cargo nextest run --workspace --locked --cargo-profile ci --no-tests=warn

  linux-headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test headless packages
        run: cargo test --locked --profile ci -p seekgram -p seekgram-core -p seekgram-service
      - name: Build headless binary
        run: cargo build --locked --profile ci -p seekgram
      - name: Smoke-test the headless MCP service
        run: python3 tests/headless_mcp.py target/ci/seekgram

  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Users pipe the script into Windows PowerShell 5.1, so parse it with both.
      - name: Parse install.ps1 (PowerShell 7)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      - name: Parse install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
      # 5.1 reads a piped script as ANSI, so anything outside ASCII would be garbled.
      - name: install.ps1 is ASCII
        shell: pwsh
        run: |
          $bad = [IO.File]::ReadAllBytes("$PWD/install.ps1") | Where-Object { $_ -gt 127 }
          if ($bad) { Write-Error "install.ps1 contains $(@($bad).Count) non-ASCII bytes"; exit 1 }
