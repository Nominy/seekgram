# The model worker's Python environment. Seekgram embeds this file and uv.lock in the
# binary and installs them with `uv sync --frozen`, so every install runs the exact
# packages the index format was validated with. After any change here, regenerate
# uv.lock with the uv version pinned in src/service/provision.rs (`uv lock`).

[project]
name = "seekgram-worker"
version = "0.1.0"
description = "EmbeddingGemma 2 worker process for Seekgram"
requires-python = "==3.12.*"
dependencies = [
    # CUDA 12.8 builds; see [tool.uv.sources].
    "torch==2.9.1",
    "torchvision==0.24.1",
    "torchaudio==2.9.1",
    "sentence-transformers[image,video]==6.3.0",
    "transformers==5.23.0",
    "huggingface-hub==1.31.0",
    "tokenizers==0.23.1",
    "safetensors==0.8.0",
    "numpy==1.26.4",
    "pillow==12.3.0",
    "soxr==1.0.0",
    # Video clips are decoded by torchvision.io.read_video, which is PyAV underneath.
    # torchvision must stay below 0.26 (the release that removes read_video) unless
    # torchcodec replaces this.
    "av==16.0.1",
]

[tool.uv]
# Only dependencies are installed; worker.py is run as a script.
package = false
# Seekgram runs on 64-bit Windows only, so the lock does not need other platforms.
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
