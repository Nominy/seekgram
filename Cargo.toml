[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/Nominy/seekgram"

[workspace.dependencies]
seekgram-core = { path = "crates/seekgram-core" }
seekgram-service = { path = "crates/seekgram-service" }
seekgram-embed = { path = "crates/seekgram-embed" }
seekgram-app = { path = "crates/seekgram-app" }
anyhow = "1"
axum = "0.8"
fs2 = "0.4"
futures-util = "0.3"
grammers-client = "=0.12.0"
# The SQLite session storage would link a second SQLite (libsql) next to rusqlite's;
# session_store.rs keeps the session in rusqlite instead.
grammers-session = { version = "=0.12.0", default-features = false }
grammers-mtsender = "=0.12.0"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" }
gpui-component = "=0.8.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mime_guess = "=2.0.5"
# JPEG through libjpeg (the mozjpeg fork of libjpeg-turbo, as Pillow decodes it), so pixels
# match the ones the index was built from. Plain C build, no NASM; `mozjpeg-sys` only to
# let libjpeg errors unwind into a Rust error.
mozjpeg = { version = "0.10", default-features = false, features = ["parallel"] }
mozjpeg-sys = { version = "2", default-features = false, features = ["unwinding"] }
# ONNX Runtime is loaded at run time from the downloaded onnxruntime.dll (DirectML build).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "directml", "api-24"] }
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
velopack = "=1.2.161"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.55"
tray-icon = { version = "0.21", default-features = false }

[package]
name = "seekgram"
description = "Search your Telegram photos, videos and audio by meaning, on your own PC"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "seekgram"

[dependencies]
seekgram-core.workspace = true
seekgram-service.workspace = true
seekgram-embed.workspace = true
seekgram-app.workspace = true
reqwest.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[build-dependencies]
embed-resource = "3"

[profile.release]
strip = true

# The UI is unusably slow unoptimized; keep dev builds snappy. Dependencies carry no
# debug info: nobody steps into them, and it is most of the link and PDB time.
[profile.dev.package."*"]
opt-level = 3
debug = false

# Our own crates: line tables are enough for backtraces and cost far less to emit and link.
[profile.dev]
debug = "line-tables-only"

# Release-like local test builds that relink in seconds: `cargo build --profile fast`.
# Ship with `--release`.
[profile.fast]
inherits = "release"
incremental = true
codegen-units = 256
lto = false
strip = true

# CI only builds and runs unit tests, which need no optimized dependencies; optimizing the
# ~600 dependencies was most of a 10-45 minute CI build on GitHub's 4-core runners.
[profile.ci]
inherits = "dev"
debug = false

[profile.ci.package."*"]
opt-level = 0
debug = false
